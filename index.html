    payments: ['coin', 'bill']
  };
  p.diag = { q1: 10, q2: 10, q3: 5, q4: 10, q5: 10, q6: 10 };
  p.baseline.monthlySales = 1800;

  p.baseline.actualProfit = 500;

  p.uplift = {

  };
  p.invest.modelId = 'pro542';
  p.invest.modelManual = false;
  p.invest.freight = true;
  p.invest.finance = { enabled: false, downPct: 10, term: 12, apr: 0, docFee: 0 };
  return p;
}

function dealTerms(deal, share, rent) {
  const shareOn = deal === 'share' || deal === 'combo';
  const rentOn = deal === 'rent' || deal === 'combo';
  return {
    share: shareOn ? clamp(num(share), 0, 100) : 0,
    rent: rentOn ? Math.max(0, num(rent)) : 0
  };
}

function amortize(principal, aprPct, months) {
  const p = Math.max(0, num(principal));
  const n = Math.max(1, Math.round(num(months)));
  const r = Math.max(0, num(aprPct)) / 100 / 12;
  if (p === 0) return 0;
  if (r === 0) return p / n;
  const f = Math.pow(1 + r, n);
  return (p * r * f) / (f - 1);
}

function recommendedModel(dailyOrders, machineType) {
  if (machineType === 'frozen') return 'freezer550';
  if (dailyOrders > 50) return 'ultra1200';
  if (dailyOrders >= 35) return 'max620s';
  if (dailyOrders >= 15) return 'pro542';
  return 'mini360';
}

/* =====================================================================

'use strict';

const $ = (sel, root) => (root || document).querySelector(sel);
const $$ = (sel, root) => Array.from((root || document).querySelectorAll(sel));

function esc(v) {
  return String(v == null ? '' : v).replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
}
function nf(v, d) {
  const n = Number(v);
  const digits = d == null ? 0 : d;
  return (isFinite(n) ? n : 0).toLocaleString('en-US', { minimumFractionDigits: digits, maximumFractionDigits: digits });
}
function money(v, d) {
  const n = Number(v) || 0;
  return (n < 0 ? '-' : '') + '$' + nf(Math.abs(n), d == null ? 0 : d);
}
function signedMoney(v, d) {
  const n = Number(v) || 0;
  return (n >= 0 ? '+' : '-') + '$' + nf(Math.abs(n), d == null ? 0 : d);
}
function pct(v, d) { return nf(v, d == null ? 1 : d) + '%'; }
function monthsFmt(v) { return isFinite(v) ? nf(v, 1) + ' ' + t('common.mo') : t('common.noPayback'); }
function todayStr() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}

function getPath(obj, path) { return path.split('.').reduce((o, k) => o == null ? undefined : o[k], obj); }
function setPath(obj, path, val) {
  const parts = path.split('.');
  const last = parts.pop();
  let cur = obj;
  parts.forEach(k => { if (!cur[k] || typeof cur[k] !== 'object') cur[k] = {}; cur = cur[k]; });
  cur[last] = val;
}

let toastTimer = null;
function toast(msg) {
  const el = $('#toast');
  if (!el) return;
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2200);
}

function downloadFile(filename, content, mime) {
  try {
    const blob = new Blob([content], { type: mime });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    a.style.display = 'none';
    document.body.appendChild(a);
    a.click();
    setTimeout(() => {
      try { URL.revokeObjectURL(url); } catch (e) {}
      a.remove();
    }, 500);
    return true;
  } catch (e) {
    return false;
  }
}

function collectAppCss() {
  const inline = Array.from(document.querySelectorAll('style')).map(el => el.textContent || '').join('\n');
  if (inline.trim()) return inline;
  let css = '';
  Array.from(document.styleSheets).forEach(sheet => {
    try {
      css += Array.from(sheet.cssRules).map(rule => rule.cssText).join('\n') + '\n';
    } catch (e) {}
  });
  return css;
}

</script>

<script data-src="js/store.js">
/* =====================================================================
   HAHA Location Replacement Assessment v2.3
   ===================================================================== */
'use strict';

const _memStore = new Map();
const storageStatus = { available: true, lastError: '' };

function storageProbe() {
  try {
    const k = '__haha_storage_probe__';
    window.localStorage.setItem(k, '1');
    window.localStorage.removeItem(k);
    storageStatus.available = true;
    storageStatus.lastError = '';
  } catch (e) {
    storageStatus.available = false;
    storageStatus.lastError = e && e.message ? e.message : 'localStorage unavailable';
  }
}

const safeStorage = {
  get(key) {
    try {
      const val = window.localStorage.getItem(key);
      return val !== null ? val : (_memStore.has(key) ? _memStore.get(key) : null);
    } catch (e) {
      return _memStore.has(key) ? _memStore.get(key) : null;
    }
  },
  set(key, val) {
    const s = String(val);
    _memStore.set(key, s);
    try {
      window.localStorage.setItem(key, s);
      return true;
    } catch (e) {
      storageStatus.available = false;
      storageStatus.lastError = e && e.message ? e.message : 'localStorage write failed';
      return false;
    }
  },
  remove(key) {
    _memStore.delete(key);
    try { window.localStorage.removeItem(key); } catch (e) {}
  }
};

storageProbe();

/* Merge legacy / imported projects with the current schema without losing
   values the user already entered. Returns null for unusable payloads. */
function normalizeProject(raw) {
  if (!raw || typeof raw !== 'object' || Array.isArray(raw)) return null;
  if (!raw.meta || typeof raw.meta !== 'object') return null;

  const base = createBlankProject(typeof raw.meta.locationName === 'string' ? raw.meta.locationName : '');
  const p = Object.assign({}, base, raw);

  p.id = (typeof raw.id === 'string' && raw.id) ? raw.id : base.id;
  p.updatedAt = raw.updatedAt || new Date().toISOString();
  p.schemaVersion = 2;

  p.meta = Object.assign({}, base.meta, raw.meta);
  p.meta.locationName = typeof p.meta.locationName === 'string' ? p.meta.locationName : '';
  p.meta.venue = typeof p.meta.venue === 'string' && p.meta.venue ? p.meta.venue : base.meta.venue;
  p.meta.city = typeof p.meta.city === 'string' ? p.meta.city : '';
  p.meta.state = typeof p.meta.state === 'string' ? p.meta.state : '';
  p.meta.date = typeof p.meta.date === 'string' && p.meta.date ? p.meta.date : todayStr();

  p.machine = Object.assign({}, base.machine, raw.machine);
  p.machine.type = typeof p.machine.type === 'string' && p.machine.type ? p.machine.type : base.machine.type;
  p.machine.age = (p.machine.age === null || p.machine.age === undefined) ? '' : p.machine.age;
  p.machine.condition = ['good', 'fair', 'poor', ''].includes(p.machine.condition) ? p.machine.condition : base.machine.condition;
  p.machine.monitoring = ['yes', 'no', ''].includes(p.machine.monitoring) ? p.machine.monitoring : base.machine.monitoring;
  p.machine.payments = Array.isArray(p.machine.payments)
    ? p.machine.payments.filter(x => ['coin', 'bill', 'card', 'mobile'].includes(x))
    : base.machine.payments.slice();

  p.diag = Object.assign({}, base.diag, raw.diag);
  ['q1', 'q2', 'q3', 'q4', 'q5', 'q6'].forEach(k => {
    const v = p.diag[k];
    p.diag[k] = (v === 0 || v === 5 || v === 10) ? Number(v) : null;
  });

  p.baseline = Object.assign({}, base.baseline, raw.baseline);
  p.site = Object.assign({}, base.site, raw.site);
  p.uplift = Object.assign({}, base.uplift, raw.uplift);
  ['variety', 'basket', 'stock', 'payment'].forEach(k => {
    p.uplift[k] = Object.assign({}, base.uplift[k], raw.uplift && raw.uplift[k]);
    if (!['yes', 'partial', 'no', ''].includes(p.uplift[k].accept)) p.uplift[k].accept = base.uplift[k].accept;
  });
  p.haha = Object.assign({}, base.haha, raw.haha);
  p.invest = Object.assign({}, base.invest, raw.invest);
  p.invest.finance = Object.assign({}, base.invest.finance, raw.invest && raw.invest.finance);
  return p;
}

function loadSavedProjects() {
  try {
    const raw = safeStorage.get(STORAGE_KEY);
    if (!raw) return [];
    const parsed = JSON.parse(raw);
    if (Array.isArray(parsed)) return parsed.map(normalizeProject).filter(Boolean);
    if (parsed && Array.isArray(parsed.projects)) return parsed.projects.map(normalizeProject).filter(Boolean);
    if (parsed && parsed.project) return [normalizeProject(parsed.project)].filter(Boolean);
  } catch (e) {}
  return [];
}

const app = {
  lang: safeStorage.get(LANG_KEY) || 'en',
  view: 'dashboard', // 'dashboard' | 'projects' | 'step1' | 'step2' | 'step3'
  projects: loadSavedProjects(),
  activeId: safeStorage.get(ACTIVE_KEY) || null,
  search: '',
  costExpanded: false,
  storageError: !storageStatus.available
};

function saveState() {
  const ok = safeStorage.set(STORAGE_KEY, JSON.stringify(app.projects));
  if (app.activeId) safeStorage.set(ACTIVE_KEY, app.activeId);
  else safeStorage.remove(ACTIVE_KEY);
  safeStorage.set(LANG_KEY, app.lang);
  app.storageError = !ok || !storageStatus.available;
  return ok;
}

function getActiveProject() {
  return app.projects.find(p => p.id === app.activeId) || null;
}

function backupProjectPayload(p) {
  return {
    schemaVersion: 2,
    appVersion: '2.3',
    exportedAt: new Date().toISOString(),
    project: p
  };
}

function exportAllPayload() {
  return {
    schemaVersion: 2,
    appVersion: '2.3',
    exportedAt: new Date().toISOString(),
    projects: app.projects
  };
}

function safeFilePart(value) {
  return String(value || 'project')
    .replace(/[\\/:*?"<>|]+/g, '-')
    .replace(/\s+/g, ' ')
    .trim()
    .slice(0, 60) || 'project';
}

function backupProjectFile(p) {
  if (!p) return false;
  const name = 'HAHA-' + safeFilePart(p.meta.locationName) + '-' + todayStr() + '.json';
  return downloadFile(name, JSON.stringify(backupProjectPayload(p), null, 2), 'application/json');
}

function exportAllFile() {
  const name = 'HAHA-All-Projects-' + todayStr() + '.json';
  return downloadFile(name, JSON.stringify(exportAllPayload(), null, 2), 'application/json');
}

function parseImportPayload(text) {
  const data = JSON.parse(text);
  let items = null;
  if (Array.isArray(data)) items = data;
  else if (data && Array.isArray(data.projects)) items = data.projects;
  else if (data && data.project) items = [data.project];
  else if (data && data.meta) items = [data];

  if (!items) return { items: [], skipped: 0, invalid: true };

  const valid = [];
  let skipped = 0;
  items.forEach(raw => {
    const p = normalizeProject(raw);
    if (p) valid.push(p); else skipped++;
  });
  return { items: valid, skipped, invalid: false };
}

function importProjects(items) {
  let added = 0;
  (items || []).forEach(p => {
    if (!p) return;
    p.id = 'p_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6);
    p.updatedAt = p.updatedAt || new Date().toISOString();
    app.projects.unshift(p);
    added++;
  });
  return added;
}

</script>

'use strict';

function num(v) {
  if (v === '' || v === null || v === undefined) return 0;
  const n = parseFloat(v);
  return isFinite(n) ? n : 0;
}
function clamp(v, lo, hi) { return Math.min(hi, Math.max(lo, v)); }
function round1(v) { return Math.round(v * 10) / 10; }

function interestPaidWithin(principal, aprPct, months, horizon) {
  const p = Math.max(0, num(principal));
  const n = Math.max(1, Math.round(num(months)));
  const r = Math.max(0, num(aprPct)) / 100 / 12;
  if (p === 0 || r === 0) return 0;
  const pmt = amortize(p, aprPct, n);
  let balance = p;
  let interest = 0;
  const count = Math.min(Math.max(0, Math.round(num(horizon))), n);
  for (let i = 0; i < count; i++) {
    const part = balance * r;
    interest += part;
    balance = Math.max(0, balance - (pmt - part));
  }
  return interest;
}

function compute(p) {
  /* 1. Replacement Urgency Score (0–100): Hardware Pain (0–40) + 6 Diagnostics (0–60) */
  const ageKnown = p.machine.age !== '' && p.machine.age !== null && p.machine.age !== undefined;
  const ageVal = num(p.machine.age);
  const agePts = !ageKnown ? 0 : (ageVal >= 7 ? 12 : ageVal >= 4 ? 6 : 0);
  const pays = Array.isArray(p.machine.payments) ? p.machine.payments : [];
  const payAnswered = pays.length > 0;
  const hasCard = pays.includes('card');
  const hasMobile = pays.includes('mobile');
  const payPts = !payAnswered ? 0 : ((!hasCard && !hasMobile) ? 12 : (!hasMobile ? 5 : 0));
  const monPts = p.machine.monitoring === 'no' ? 8 : 0;
  const condPts = p.machine.condition === 'poor' ? 8 : (p.machine.condition === 'fair' ? 4 : 0);
  const hwPts = clamp(agePts + payPts + monPts + condPts, 0, 40);

  const diagKeys = ['q1', 'q2', 'q3', 'q4', 'q5', 'q6'];
  const diagValues = diagKeys.map(k => p.diag[k]);
  const diagAnswered = diagValues.every(v => v === 0 || v === 5 || v === 10);
  const offensePts = num(p.diag.q1) + num(p.diag.q2) + num(p.diag.q3); // 0–30
  const defensePts = num(p.diag.q4) + num(p.diag.q5) + num(p.diag.q6); // 0–30
  const commercialPts = clamp(offensePts + defensePts, 0, 60);
  const urgencyTotal = clamp(hwPts + commercialPts, 0, 100);
  const urgencyTier = urgencyTotal >= 75 ? 'strong' : urgencyTotal >= 50 ? 'model' : 'low';
  const step1Complete = !!(String(p.meta.locationName || '').trim() && ageKnown &&
    ['good', 'fair', 'poor'].includes(p.machine.condition) &&
    ['yes', 'no'].includes(p.machine.monitoring) &&
    payAnswered && diagAnswered);

  const hiddenRepairRisk = (ageKnown && ageVal >= 7) || p.machine.condition === 'poor';

  const rationale = [];
  if (ageKnown && ageVal >= 7) rationale.push({ code: 'age', vars: { years: Math.round(ageVal) } });
  if (p.machine.condition === 'poor') rationale.push({ code: 'condition' });
  if (payAnswered && !hasCard && !hasMobile) rationale.push({ code: 'noCashless' });
  else if (payAnswered && !hasMobile) rationale.push({ code: 'noMobile' });
  if (p.machine.monitoring === 'no') rationale.push({ code: 'monitoring' });
  if (num(p.diag.q1) === 10) rationale.push({ code: 'marginCeiling' });
  if (num(p.diag.q5) === 10) rationale.push({ code: 'retention' });
  if (num(p.diag.q4) === 10) rationale.push({ code: 'friction' });
  if (!rationale.length && step1Complete) rationale.push({ code: 'default' });

  /* 2. Single-Source Sales Baseline (30-day backend basis) */
  const b = p.baseline;
  const oldSales = Math.max(0, num(b.monthlySales));
  const oldMonthlyOrders = Math.max(0, num(b.monthlyOrders));
  const oldOrdersEstimated = !!b.ordersEstimated;
  const oldDailyOrders = oldMonthlyOrders / 30;
  const oldAov = oldMonthlyOrders > 0 ? oldSales / oldMonthlyOrders : 0;

  const siteTerms = dealTerms(p.site.deal, p.site.share, p.site.rent);
  const oldSiteFee = oldSales * siteTerms.share / 100 + siteTerms.rent;

  const oldDetail = {
    cogs: oldSales * clamp(num(b.cogsRate), 0, 100) / 100,
    commission: oldSiteFee,
    processing: oldSales * clamp(num(b.cashlessShare), 0, 100) / 100 * clamp(num(b.cardFee), 0, 100) / 100,
    reader: Math.max(0, num(b.readerFee)),
    platform: Math.max(0, num(b.platform)),
    other: Math.max(0, num(b.other))
  };

  let oldProfit = 0;
  let oldCost = 0;
  if (b.profitMode === 'actual') {
    oldProfit = num(b.actualProfit);
    oldCost = oldSales - oldProfit;
  } else if (b.profitMode === 'detail') {
    oldCost = oldDetail.cogs + oldDetail.commission + oldDetail.processing + oldDetail.reader + oldDetail.platform + oldDetail.other;
    oldProfit = oldSales - oldCost;
  } else {
    oldProfit = oldSales * clamp(num(b.estMarginPct), 0, 100) / 100;
    oldCost = oldSales - oldProfit;
  }
  const oldMargin = oldSales > 0 ? (oldProfit / oldSales) * 100 : 0;

  /* 3. Silent Quadrant Derivation (Sales >= $1,200 & Urgency >= 60) */
  const highRev = oldSales >= REVENUE_LINE;
  const highUrg = urgencyTotal >= URGENCY_HIGH_LINE;
  const quadrantId = highRev ? (highUrg ? 1 : 2) : (highUrg ? 3 : 4);

  /* 4. Growth Consensus with Exact Pro-Rata Cap Scaling */
  const up = p.uplift;
  const vPct = Math.max(0, num(up.variety.pct));
  const sPct = Math.max(0, num(up.stock.pct));
  const pPct = Math.max(0, num(up.payment.pct));
  const bPct = Math.max(0, num(up.basket.pct));

  const orderRaw = vPct + sPct + pPct;
  const orderCapped = orderRaw > 40;
  const orderPct = clamp(orderRaw, 0, 40);
  const orderScale = orderRaw > 0 ? (orderPct / orderRaw) : 1;

  const aovCapped = bPct > 25;
  const aovPct = clamp(bPct, 0, 25);

  const hahaMonthlyOrders = oldMonthlyOrders * (1 + orderPct / 100);
  const hahaDailyOrders = hahaMonthlyOrders / 30;
  const hahaAov = oldAov * (1 + aovPct / 100);
  const hahaSales = hahaMonthlyOrders * hahaAov;

  const varietyRev = ((vPct * orderScale) / 100) * oldSales;
  const stockRev   = ((sPct * orderScale) / 100) * oldSales;
  const paymentRev = ((pPct * orderScale) / 100) * oldSales;
  const basketRev  = hahaMonthlyOrders * (hahaAov - oldAov);
  const totalRevenueGrowth = hahaSales - oldSales;
  const totalRevenueGrowthPct = oldSales > 0 ? (totalRevenueGrowth / oldSales) * 100 : 0;
  const appliedPct = {
    variety: vPct * orderScale,
    basket: aovPct,
    stock: sPct * orderScale,
    payment: pPct * orderScale
  };

  /* 5. HAHA P&L */
  const h = p.haha;
  const hahaTerms = p.site.overrideDeal
    ? dealTerms(p.site.deal, p.site.hahaShare, p.site.hahaRent)
    : siteTerms;

  const cogsRate = clamp(num(h.cogsRate), 0, 100);
  const procRate = clamp(num(h.processing), 0, 100);
  const shrinkRate = clamp(num(h.shrinkage), 0, 100);
  const aiPerOrder = Math.max(0, num(h.aiPerOrder));

  const hahaCogs = hahaSales * cogsRate / 100;
  const hahaShareCost = hahaSales * hahaTerms.share / 100;
  const hahaRent = hahaTerms.rent;
  const hahaSiteFee = hahaShareCost + hahaRent;
  const hahaProcessing = hahaSales * procRate / 100;
  const hahaShrinkage = hahaSales * shrinkRate / 100;
  const hahaFixed = Math.max(0, num(h.saas)) + Math.max(0, num(h.sim)) + Math.max(0, num(h.pos)) + Math.max(0, num(h.maintenance)) + Math.max(0, num(h.other));
  const hahaAi = hahaMonthlyOrders * aiPerOrder;

  const hahaCost = hahaCogs + hahaSiteFee + hahaProcessing + hahaShrinkage + hahaFixed + hahaAi;
  const hahaProfit = hahaSales - hahaCost;
  const hahaMargin = hahaSales > 0 ? (hahaProfit / hahaSales) * 100 : 0;

  const varRateSum = (cogsRate + hahaTerms.share + procRate + shrinkRate) / 100;
  const fixedTotal = hahaFixed + hahaRent;
  const zeroGrowthProfit = oldSales - (oldSales * varRateSum) - fixedTotal - (oldMonthlyOrders * aiPerOrder);

  /* 6. Model Recommendation (Daily Orders + Frozen Machine Type) & Net Investment */
  const basisDailyOrders = hahaDailyOrders > 0 ? hahaDailyOrders : oldDailyOrders;
  const recModelId = recommendedModel(basisDailyOrders, p.machine.type);
  const effectiveModelId = p.invest.modelManual ? p.invest.modelId : recModelId;
  const activeModel = MODELS.find(m => m.id === effectiveModelId) || MODELS[2];

  const equipment = activeModel.msrp;
  const freight = p.invest.freight ? FREIGHT_FEE : 0;
  const install = Math.max(0, num(p.invest.install));
  const removal = Math.max(0, num(p.invest.removal));
  const tradeIn = Math.max(0, num(p.invest.tradeIn));
  const investment = Math.max(0, equipment + freight + install + removal - tradeIn);

  const delta = hahaProfit - oldProfit;
  const annualDelta = delta * 12;
  const payback = delta > 0 ? investment / delta : Infinity;
  const standalonePayback = hahaProfit > 0 ? investment / hahaProfit : Infinity;

  /* 7. Financing (CRITICAL: docFee ONLY at signing, NEVER inside principal) */
  const f = p.invest.finance;
  const financed = !!(f.enabled && investment > 0);
  const down = investment * clamp(num(f.downPct), 0, 100) / 100;
  const docFee = Math.max(0, num(f.docFee));
  const principal = Math.max(0, investment - down);
  const finMonths = clamp(Math.round(num(f.term) || 12), 1, 120);
  const apr = Math.max(0, num(f.apr));
  const payment = amortize(principal, apr, finMonths);
  const cashDueAtSigning = financed ? (down + docFee) : investment;
  const totalPaid = financed ? (payment * finMonths + down + docFee) : investment;
  const totalInterest = financed ? Math.max(0, payment * finMonths - principal) : 0;
  const coverage = payment > 0 ? hahaProfit / payment : Infinity;
  const cashAfter = hahaProfit - payment;
  const vsOldCash = cashAfter - oldProfit;
  const selfFunding = financed && payment > 0 && hahaProfit >= payment && delta > 0 && vsOldCash >= 0;
  const financingCost36 = financed ? interestPaidWithin(principal, apr, finMonths, 36) + docFee : 0;
  const threeYearNet = delta * 36 - investment - financingCost36;
  const roi3 = investment > 0 ? (threeYearNet / investment) * 100 : 0;

  /* 8. Stress Test (100% / 80% / 60% of projected sales) */
  const stress = [1, 0.8, 0.6].map(scale => {
    const sSales = hahaSales * scale;
    const sOrders = hahaMonthlyOrders * scale;
    const sProfit = sSales - (sSales * varRateSum) - fixedTotal - (sOrders * aiPerOrder);
    const sDelta = sProfit - oldProfit;
    return {
      scale,
      sales: sSales,
      profit: sProfit,
      delta: sDelta,
      payback: sDelta > 0 ? investment / sDelta : Infinity,
      coverage: payment > 0 ? sProfit / payment : Infinity
    };
  });

  /* 9. Business Viability Verdict (No internal A/B grade jargon) */
  const hasData = oldSales > 0 && oldMonthlyOrders > 0;
  const relGain = oldProfit > 0 ? delta / oldProfit : (delta >= 200 ? 1 : 0);
  let verdict = 'defer'; // 'strong' | 'positive' | 'conditional' | 'defer'
  if (hasData && delta > 0) {
    if (payback <= 24 && relGain >= 0.2 && (!financed || coverage >= 1.5)) verdict = 'strong';
    else if (payback <= 36 && (!financed || coverage >= 1.2)) verdict = 'positive';
    else if (payback <= 48) verdict = 'conditional';
  }
  const viable = verdict === 'strong' || verdict === 'positive';

  /* 10. Warnings */
  const warnings = [];
  if (!hasData) warnings.push({ level: 'info', code: 'noSales' });
  if (orderCapped) warnings.push({ level: 'warn', code: 'orderCap' });
  if (aovCapped) warnings.push({ level: 'warn', code: 'aovCap' });
  if (financed && coverage < 1.25) warnings.push({ level: 'warn', code: 'coverageLow', vars: { coverage: coverage.toFixed(2) } });
  if (financed && vsOldCash < 0) warnings.push({ level: 'warn', code: 'cashBelowOld' });
  if (hasData && delta > 0 && payback > 36) warnings.push({ level: 'warn', code: 'longPayback', vars: { months: payback.toFixed(0) } });

  return {
    hasData,
    step1Complete,
    urgency: { total: urgencyTotal, hwPts, commercialPts, offensePts, defensePts, tier: urgencyTier, complete: step1Complete, diagAnswered, payAnswered, ageKnown },
    hiddenRepairRisk,
    rationale,
    quadrantId,
    siteTerms,
    hahaTerms,
    old: { sales: oldSales, monthlyOrders: oldMonthlyOrders, dailyOrders: oldDailyOrders, aov: oldAov, siteFee: oldSiteFee, profit: oldProfit, cost: oldCost, margin: oldMargin, detail: oldDetail, ordersEstimated: oldOrdersEstimated },
    growth: { orderRaw, orderPct, orderScale, aovPct, orderCapped, aovCapped, appliedPct, varietyRev, stockRev, paymentRev, basketRev, totalRevenueGrowth, totalRevenueGrowthPct },
    haha: { sales: hahaSales, monthlyOrders: hahaMonthlyOrders, dailyOrders: hahaDailyOrders, aov: hahaAov, cogs: hahaCogs, shareCost: hahaShareCost, rent: hahaRent, siteFee: hahaSiteFee, processing: hahaProcessing, shrinkage: hahaShrinkage, fixed: hahaFixed, ai: hahaAi, cost: hahaCost, profit: hahaProfit, margin: hahaMargin, zeroGrowthProfit },
    invest: { recModelId, effectiveModelId, model: activeModel, equipment, freight, install, removal, tradeIn, total: investment, delta, annualDelta, payback, standalonePayback, threeYearNet, roi3 },
    finance: { enabled: financed, down, docFee, principal, months: finMonths, apr, payment, cashDueAtSigning, totalPaid, totalInterest, financingCost36, coverage, cashAfter, vsOldCash, selfFunding },
    stress,
    verdict,
    viable,
    warnings,
    siteEarnings: { monthly: hahaSiteFee, annual: hahaSiteFee * 12 }
  };
}

function syncUpliftBase(p, force) {
  const q = compute(p).quadrantId;
  if (!force && p.uplift.initialized && p.uplift._baseQ === q) return;
  ['variety', 'basket', 'stock', 'payment'].forEach(k => {
    if (force || !p.uplift[k].custom) {
      const f = p.uplift[k].accept === 'yes' ? 1 : p.uplift[k].accept === 'partial' ? 0.5 : 0;
      p.uplift[k].pct = round1(QUADRANT_BASE[q][k] * f);
      if (force) p.uplift[k].custom = false;
    }
  });
  p.uplift.initialized = true;
  p.uplift._baseQ = q;
}

/* Step completion is based on the current data, not on a "visited" flag.
   Clearing a required field re-locks the forward action. */
function validateStep1(p) {
  if (!p) return { ok: false, missing: ['project'] };
  const missing = [];
  if (!String(p.meta.locationName || '').trim()) missing.push('locationName');
  if (p.machine.age === '' || p.machine.age === null || p.machine.age === undefined) missing.push('machineAge');
  if (!['good', 'fair', 'poor'].includes(p.machine.condition)) missing.push('condition');
  if (!['yes', 'no'].includes(p.machine.monitoring)) missing.push('monitoring');
  if (!Array.isArray(p.machine.payments) || !p.machine.payments.length) missing.push('payments');
  const diagOk = ['q1', 'q2', 'q3', 'q4', 'q5', 'q6'].every(k => [0, 5, 10].includes(p.diag[k]));
  if (!diagOk) missing.push('diag');
  return { ok: missing.length === 0, missing };
}

function validateStep2(p) {
  if (!p) return { ok: false, missing: ['project'] };
  const b = p.baseline;
  const f = p.invest.finance;
  const missing = [];

  if (!(num(b.monthlySales) > 0)) missing.push('monthlySales');
  if (!(num(b.monthlyOrders) > 0)) missing.push('monthlyOrders');
  if (!['actual', 'margin', 'detail'].includes(b.profitMode)) missing.push('profitMode');
  if (b.profitMode === 'actual' && (b.actualProfit === '' || b.actualProfit === null || b.actualProfit === undefined)) missing.push('actualProfit');
  if (b.profitMode === 'margin' && !(num(b.estMarginPct) >= 0 && num(b.estMarginPct) <= 100)) missing.push('estMarginPct');

  if (!['share', 'rent', 'combo', 'none'].includes(p.site.deal)) missing.push('siteDeal');
  if ((p.site.deal === 'share' || p.site.deal === 'combo') && !(num(p.site.share) >= 0 && num(p.site.share) <= 100)) missing.push('siteShare');
  if ((p.site.deal === 'rent' || p.site.deal === 'combo') && !(num(p.site.rent) >= 0)) missing.push('siteRent');

  if (!MODELS.some(m => m.id === p.invest.modelId)) missing.push('model');

  if (f.enabled) {
    if (!(num(f.downPct) >= 0 && num(f.downPct) <= 100)) missing.push('downPct');
    if (!(num(f.term) >= 1 && num(f.term) <= 72)) missing.push('term');
    if (!(num(f.apr) >= 0)) missing.push('apr');
    if (!(num(f.docFee) >= 0)) missing.push('docFee');
  }

  return { ok: missing.length === 0, missing };
}

function canEnterStep(step, p) {
  if (!p) return false;
  if (step === 'step1' || step === 'dashboard' || step === 'projects') return true;
  const s1 = validateStep1(p);
  if (step === 'step2') return s1.ok;
  if (step === 'step3') return s1.ok && validateStep2(p).ok;
  return true;
}

function stepMissingText(step, p) {
  if (!p) return t('validate.project');
  if (step === 'step1') {
    const s1 = validateStep1(p);
    return s1.ok ? t('s1.footerReady') : t('validate.need', { items: s1.missing.map(k => t('validate.' + k)).join(' · ') });
  }
  if (step === 'step2') {
    const s1 = validateStep1(p);
    if (!s1.ok) return t('validate.step1First');
    const s2 = validateStep2(p);
    return s2.ok ? t('s2.footerReady') : t('validate.need', { items: s2.missing.map(k => t('validate.' + k)).join(' · ') });
  }
  return '';
}

function newCashAtMonth(m, i) {
  const f = m.finance;
  if (f.enabled) {
    const paidMonths = Math.min(i, f.months);
    return m.haha.profit * i - f.cashDueAtSigning - f.payment * paidMonths;
  }
  return m.haha.profit * i - m.invest.total;
}

function cumulativeSvg(m, w, h) {
  w = w || 680;
  h = h || 215;
  const months = 36;
  const oldEnd = m.old.profit * months;
  const newStart = newCashAtMonth(m, 0);
  const newEnd = newCashAtMonth(m, months);
  const vals = [0, oldEnd, newEnd, newStart];
  let max = Math.max.apply(null, vals);
  let min = Math.min.apply(null, vals);
  if (max === min) { max += 500; min -= 500; }
  const range = max - min;
  const rawStep = range / 5;
  const pow = Math.pow(10, Math.floor(Math.log10(rawStep || 1)));
  const step = ([1, 2, 2.5, 5, 10].find(c => range / (c * pow) <= 5) || 10) * pow;
  min = Math.floor(min / step) * step;
  max = Math.ceil(max / step) * step;
  const ticks = Math.max(1, Math.round((max - min) / step));

  const pad = { l: 58, r: 16, t: 16, b: 26 };
  const iw = w - pad.l - pad.r;
  const ih = h - pad.t - pad.b;
  const X = i => pad.l + (i / months) * iw;
  const Y = v => pad.t + ((max - v) / (max - min)) * ih;

  let grid = '';
  for (let k = 0; k <= ticks; k++) {
    const v = min + step * k;
    const y = Y(v);
    const lbl = Math.abs(v) >= 1000 ? (v < 0 ? '-$' : '$') + (Math.abs(v) / 1000).toFixed(1) + 'k' : money(v, 0);
    grid += `<line x1="${pad.l}" x2="${w - pad.r}" y1="${y.toFixed(1)}" y2="${y.toFixed(1)}" stroke="#e8e8e5" stroke-width="1"/>`;
    grid += `<text x="${pad.l - 6}" y="${(y + 3).toFixed(1)}" text-anchor="end" font-size="9" fill="#777">${lbl}</text>`;
  }
  if (min < 0 && max > 0) {
    grid += `<line x1="${pad.l}" x2="${w - pad.r}" y1="${Y(0).toFixed(1)}" y2="${Y(0).toFixed(1)}" stroke="#bcbcb8" stroke-width="1"/>`;
  }

  let xLbl = '';
  [0, 6, 12, 18, 24, 30, 36].forEach(i => {
    xLbl += `<text x="${X(i).toFixed(1)}" y="${h - 7}" text-anchor="middle" font-size="9" fill="#777">${i === 0 ? '0' : i + 'm'}</text>`;
  });

  let oldPath = '';
  let newPath = '';
  for (let i = 0; i <= months; i++) {
    oldPath += `${i === 0 ? 'M' : 'L'} ${X(i).toFixed(1)} ${Y(m.old.profit * i).toFixed(1)} `;
    newPath += `${i === 0 ? 'M' : 'L'} ${X(i).toFixed(1)} ${Y(newCashAtMonth(m, i)).toFixed(1)} `;
  }

  /* Cash-flow crossover, including down payment / monthly payments when financed. */
  let cashPayback = Infinity;
  if (newCashAtMonth(m, 0) >= 0) {
    cashPayback = 0;
  } else {
    let prevDiff = newCashAtMonth(m, 0);
    for (let i = 1; i <= months; i++) {
      const diff = newCashAtMonth(m, i) - m.old.profit * i;
      if (diff >= 0) {
        cashPayback = prevDiff < 0 ? (i - 1) + (-prevDiff) / (diff - prevDiff) : i;
        break;
      }
      prevDiff = diff;
    }
  }

  let marker = '';
  const pb = cashPayback;
  if (isFinite(pb) && pb > 0 && pb <= months) {
    const px = X(pb);
    const py = Y(m.old.profit * pb);
    marker = `<line x1="${px.toFixed(1)}" x2="${px.toFixed(1)}" y1="${pad.t}" y2="${h - pad.b}" stroke="#1e7e4e" stroke-width="1" stroke-dasharray="3 3"/>
      <circle cx="${px.toFixed(1)}" cy="${py.toFixed(1)}" r="4" fill="#1e7e4e"/>
      <text x="${Math.min(px + 7, w - 95).toFixed(1)}" y="${Math.max(py - 8, 24).toFixed(1)}" font-size="9.5" font-weight="800" fill="#1e7e4e">${esc(t('s2.cashPaybackShort') + ' ' + monthsFmt(pb))}</text>`;
  }

  return `<svg viewBox="0 0 ${w} ${h}" width="100%" style="display:block;height:auto">
    ${grid}
    <path d="${oldPath}" fill="none" stroke="#8f8f8b" stroke-width="1.8" stroke-dasharray="4 3"/>
    <path d="${newPath}" fill="none" stroke="#1e7e4e" stroke-width="2.4"/>
    ${marker}${xLbl}
  </svg>`;
}

function buildDecisionBullets(m) {
  const list = [];
  if (m.hasData && m.invest.delta > 0) {
    list.push(t('vReason.gain', {
      delta: signedMoney(m.invest.delta, 0),
      annual: signedMoney(m.invest.annualDelta, 0),
      standalone: monthsFmt(m.invest.standalonePayback),
      inc: monthsFmt(m.invest.payback)
    }));
    list.push(t('vReason.3yr', { net3: signedMoney(m.invest.threeYearNet, 0), inv: money(m.invest.total, 0) }));
    if (m.finance.enabled && isFinite(m.finance.coverage)) {
      list.push(t('vReason.fin', { pmt: money(m.finance.payment, 2), cov: nf(m.finance.coverage, 2), vsOld: signedMoney(m.finance.vsOldCash, 0) }));
    } else {
      list.push(t('vReason.downside', { down: money(m.stress[2].profit, 0) }));
    }
  } else {
    list.push(t('vReason.neg'));
  }
  if (m.hiddenRepairRisk) {
    list.push(t('s2.hiddenRiskText'));
  }
  return list;
}

function buildConsultativeNextSteps(m) {
  if (m.verdict === 'strong') return [t('next.strong1'), t('next.strong2'), t('next.strong3')];
  if (m.verdict === 'positive') return [t('next.pos1'), t('next.pos2'), t('next.pos3')];
  if (m.verdict === 'conditional') return [t('next.cond1'), t('next.cond2'), t('next.cond3')];
  return [t('next.defer1'), t('next.defer2'), t('next.defer3')];
}

function showModal(html) {
  const root = $('#modalRoot');
  if (root) root.innerHTML = `<div class="modal-backdrop" id="modalBack"><div class="modal">${html}</div></div>`;
}
function closeModal() {
  const root = $('#modalRoot');
  if (root) root.innerHTML = '';
}

function openNewProjectModal() {
  showModal(`
    <h3>${esc(t('modal.newTitle'))}</h3>
    <p>${esc(t('modal.newDesc'))}</p>
    <form id="newProjForm" novalidate>
      <div class="field">

        <div class="error-text hidden" id="newProjError">${esc(t('modal.locErr'))}</div>
      </div>
      <div class="modal-actions">
        <button type="button" class="button button-outline" data-action="closeModal">${esc(t('common.cancel'))}</button>
        <button type="submit" class="button button-dark">${esc(t('modal.createBtn'))}</button>
      </div>
    </form>
  `);
  const inp = $('#newProjNameInput');
  const err = $('#newProjError');
  const form = $('#newProjForm');
  if (inp) {
    setTimeout(() => inp.focus(), 20);
    inp.addEventListener('input', () => {
      if (inp.value.trim()) {
        inp.classList.remove('input-error');
        if (err) err.classList.add('hidden');
      }
    });
  }
  if (form) {
    form.addEventListener('submit', ev => {
      ev.preventDefault();
      const name = inp ? inp.value.trim() : '';
      if (!name) {
        if (inp) { inp.classList.add('input-error'); inp.focus(); }
        if (err) err.classList.remove('hidden');
        return;
      }
      const p = createBlankProject(name);
      app.projects.unshift(p);

      app.view = 'step1';
      saveState();
      closeModal();
      mountView();
      toast(t('common.created'));
    });

        ${m.hasData ? `<div class="rep-note"><strong>${esc(t('rep.downsideTitle'))}:</strong> ${esc(t('rep.downsideText', { zero: money(m.haha.zeroGrowthProfit, 0), stress: money(m.stress[2].profit, 0) }))}</div>` : ''}
        ${m.hasData && m.invest.delta > 0 ? `<div class="rep-note">${esc(t('rep.delayText', { delta: money(m.invest.delta, 0), six: money(m.invest.delta * 6, 0) }))}</div>` : ''}

      <!-- 01 · Site & Diagnostic Overview -->

        <h3>${esc(t('s3.sec1'))}</h3>

            <tr><td>${esc(t('s1.mAge'))} / ${esc(t('s1.mCond'))}</td><td class="r">${p.machine.age !== '' ? p.machine.age + ' ' + esc(t('rep.years')) : '—'} · ${esc(t('cond.' + p.machine.condition))}</td></tr>
            <tr><td>${esc(t('s1.mMon'))}</td><td class="r">${esc(t('common.' + p.machine.monitoring))}</td></tr>
            <tr><td>${esc(t('s1.railHw'))} / ${esc(t('s1.railComm'))}</td><td class="r">${m.urgency.hwPts}/40 · ${m.urgency.commercialPts}/60</td></tr>
            <tr class="total"><td>${esc(t('s1.railTitle'))}</td><td class="r">${m.urgency.total} / 100</td></tr>

        ${m.old.ordersEstimated ? `<div class="rep-note">${esc(t('rep.estimatedOrders'))}</div>` : ''}
        <table class="table">
          <thead><tr><th>${esc(t('s2.metric'))}</th><th class="r">${esc(t('s2.cur'))}</th><th class="r">${esc(t('s2.haha'))}</th><th class="r">${esc(t('s2.chg'))}</th></tr></thead>
          <tbody>
            <tr><td>${esc(t('s2.rOrders'))}</td><td class="r">${nf(m.old.monthlyOrders, 0)}</td><td class="r">${nf(m.haha.monthlyOrders, 0)}</td><td class="r">+${pct(m.growth.orderPct, 1)}</td></tr>
            <tr><td>${esc(t('s2.rAov'))}</td><td class="r">${money(m.old.aov, 2)}</td><td class="r">${money(m.haha.aov, 2)}</td><td class="r">${signedMoney(m.haha.aov - m.old.aov, 2)}</td></tr>
            <tr><td>${esc(t('s2.rSales'))}</td><td class="r">${money(m.old.sales, 0)}</td><td class="r">${money(m.haha.sales, 0)}</td><td class="r">${signedMoney(m.growth.totalRevenueGrowth, 0)}</td></tr>
            <tr class="total"><td>${esc(t('s2.rCost'))}</td><td class="r">${money(m.old.cost, 0)}</td><td class="r">${money(m.haha.cost, 0)}</td><td class="r">${signedMoney(m.haha.cost - m.old.cost, 0)}</td></tr>
            <tr class="primary"><td>${esc(t('s2.rProfit'))}</td><td class="r">${money(m.old.profit, 0)}</td><td class="r">${money(m.haha.profit, 0)}</td><td class="r">${signedMoney(m.invest.delta, 0)}</td></tr>
          </tbody>
        </table>
        <div style="margin-top:14px">${cumulativeSvg(m, 680, 175)}</div>
        <div class="rep-note">${esc(t('s2.chartExplain'))}</div>
      </div>

      <!-- 03 · Investment, Financing & Stress Test -->
      <div class="rep-sec">
        <h3>${esc(t('s3.sec3'))}</h3>
        <div class="rep-two">
          <table class="table">
            <tr><td>${esc(m.invest.model.name)} ${esc(t('rep.msrp'))}</td><td class="r">${money(m.invest.equipment, 0)}</td></tr>
            <tr><td>${esc(t('rep.freightInstallRemoval'))}</td><td class="r">${money(m.invest.freight + m.invest.install + m.invest.removal, 0)}</td></tr>
            <tr><td>${esc(t('s2.tradeIn'))}</td><td class="r">-${money(m.invest.tradeIn, 0)}</td></tr>
            <tr class="total"><td>${esc(t('r2.netInv'))}</td><td class="r">${money(m.invest.total, 0)}</td></tr>
            <tr><td>${esc(t('s2.payMethod'))}</td><td class="r">${f.enabled ? esc(t('rep.financeLine', { months: m.finance.months, apr: nf(m.finance.apr, 1), payment: money(m.finance.payment, 2), coverage: isFinite(m.finance.coverage) ? nf(m.finance.coverage, 2) : '—' })) : esc(t('s2.cash'))}</td></tr>
            ${f.enabled ? `<tr><td>${esc(t('rep.financeCost'))}</td><td class="r">${money(m.finance.financingCost36, 0)}</td></tr>` : ''}
            <tr><td>${esc(t('rep.machineOnly'))}</td><td class="r">${esc(monthsFmt(m.invest.standalonePayback))}</td></tr>
            <tr><td>${esc(t('s2.propTitle'))}</td><td class="r">${money(m.siteEarnings.monthly, 0)}${t('rep.perMonth')} (${money(m.siteEarnings.annual, 0)}${t('rep.perYear')})</td></tr>
          </table>
          <table class="table">
            <thead><tr><th>${esc(t('rep.stress'))}</th><th class="r">${esc(t('rep.profit'))}</th><th class="r">${esc(t('rep.delta'))}</th><th class="r">${esc(t('rep.payback'))}</th></tr></thead>
            <tbody>
              ${m.stress.map(st => `<tr><td>${nf(st.scale * 100, 0)}%</td><td class="r">${money(st.profit, 0)}</td><td class="r">${signedMoney(st.delta, 0)}</td><td class="r">${esc(monthsFmt(st.payback))}</td></tr>`).join('')}
            </tbody>
          </table>
        </div>
        ${f.enabled ? `<div class="rep-note">${esc(t('rep.financeCostNote', { cost: money(m.finance.financingCost36, 0) }))}</div>` : ''}
      </div>

      <!-- 04 · Next Steps & Assessment Notes (NO Sign-Off lines) -->
      <div class="rep-sec">
        <h3>${esc(t('s3.sec4'))}</h3>
        <div class="rep-subh">${esc(t('s3.nextSub'))}</div>
        <ol class="rep-list">
          ${nextSteps.map(n => `<li>${esc(n)}</li>`).join('')}
        </ol>
        <div class="rep-deploy-bar">${esc(t('s3.deployNote'))}</div>
        <div class="rep-subh">${esc(t('s3.basisSub'))}</div>
        <div class="rep-note">${esc(t('s3.method'))}</div>
        <div class="rep-note">${esc(t('s3.disclaimer'))}</div>
      </div>

      <div class="rep-foot-bar">
        <span>HAHA Vending · ${esc(t('s3.docType'))}</span>
        <span>${esc(locName)} · ${esc(p.meta.date)}</span>
      </div>
    </div>
  `;
}

function renderStep3(p, m) {
  return `
    <div class="report-toolbar no-print">
      <button type="button" class="button button-outline" data-nav="step2">${esc(t('s3.back'))}</button>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button type="button" class="button button-dark" data-action="printReport">${esc(t('s3.print'))}</button>
        <button type="button" class="button button-outline" data-action="downloadReport">${esc(t('s3.download'))}</button>
      </div>
    </div>
    ${reportDocumentHtml(p, m)}
  `;
}

<script data-src="js/sync.js">
/* =====================================================================
   HAHA Location Replacement Assessment v2.3
   ===================================================================== */
'use strict';

function syncOutputs() {
  const p = getActiveProject();
  if (!p) return;
  const m = compute(p);

  const topName = $('[data-out="topProjName"]');
  if (topName) topName.textContent = p.meta.locationName || t('top.untitled');

  /* STEP 01 RAIL */
  if (app.view === 'step1') {
    const rail = $('#railHost');
    if (rail) {
      const u = m.urgency;
      const complete = u.complete;
      const tierCls = u.tier === 'strong' ? 'strong' : u.tier === 'model' ? 'conditional' : 'defer';
      const tierLbl = u.tier === 'strong' ? t('s1.tierStrong') : u.tier === 'model' ? t('s1.tierModel') : t('s1.tierLow');
      rail.innerHTML = `
        <div class="rail-panel">
          <div class="rail-label">${esc(t('s1.railTitle'))}</div>
          <div class="rail-big">${complete ? u.total : '--'}<span style="font-size:18px;color:#888;font-weight:700"> / 100</span></div>
          <div style="margin-top:8px"><span class="status-badge ${complete ? tierCls : 'defer'}">${esc(complete ? tierLbl : t('s1.railPending'))}</span></div>
          <div class="score-bar-track" style="margin-top:12px"><div class="score-bar-fill" style="width:${complete ? u.total : 0}%"></div></div>
          <div class="rail-div"></div>
          <div class="breakdown-bar">
            <div class="breakdown-head"><span>${esc(t('s1.railHw'))}</span><strong>${complete ? u.hwPts : '—'} / 40</strong></div>
            <div class="score-bar-track"><div class="score-bar-fill" style="width:${complete ? (u.hwPts / 40) * 100 : 0}%"></div></div>
          </div>
          <div class="breakdown-bar">
            <div class="breakdown-head"><span>${esc(t('s1.railComm'))}</span><strong>${complete ? u.commercialPts : '—'} / 60</strong></div>
            <div class="score-bar-track"><div class="score-bar-fill" style="width:${complete ? (u.commercialPts / 60) * 100 : 0}%"></div></div>
          </div>
        </div>
      `;
    }
    syncStepGates(p);
    renderStorageWarning();
    return;
  }

  /* STEP 02 LIVE OUTPUTS */
  if (app.view === 'step2') {
    const out = {
      dAov: m.old.aov > 0 ? money(m.old.aov, 2) : '—',
      dDaily: m.old.monthlyOrders > 0 ? nf(m.old.dailyOrders, 1) + t('common.perDay') : '—',
      dMargin: m.old.sales > 0 ? pct(m.old.margin, 1) : '—',
      oldSiteFee: money(m.old.siteFee, 2) + t('common.perMonth'),
      siteFormulaCur: t('s2.formulaCur', {
        sales: money(m.old.sales, 0),
        share: nf(m.siteTerms.share, 1),
        rent: money(m.siteTerms.rent, 0),
        total: money(m.old.siteFee, 2)
      }),
      siteFormulaNew: t('s2.formulaNew', {
        sales: money(m.haha.sales, 0),
        share: nf(m.hahaTerms.share, 1),
        rent: money(m.hahaTerms.rent, 0),
        total: money(m.haha.siteFee, 2)
      }),
      upRevVariety: '+' + money(m.growth.varietyRev, 0) + t('common.perMonth'),
      upRevBasket:  '+' + money(m.growth.basketRev, 0) + t('common.perMonth'),
      upRevStock:   '+' + money(m.growth.stockRev, 0) + t('common.perMonth'),
      upRevPayment: '+' + money(m.growth.paymentRev, 0) + t('common.perMonth'),
      projSales: m.hasData ? money(m.haha.sales, 0) + t('common.perMonth') : '—',
      revUplift: m.hasData ? '+' + pct(m.growth.totalRevenueGrowthPct, 1) + ' (+' + money(m.growth.totalRevenueGrowth, 0) + ')' : '—',
      projDaily: m.hasData ? nf(m.haha.dailyOrders, 1) + t('common.perDay') : '—',
      cashSigning: money(m.finance.cashDueAtSigning, 0),
      finPayment: money(m.finance.payment, 2) + t('common.perMonth'),
      finCoverage: isFinite(m.finance.coverage) ? nf(m.finance.coverage, 2) + '×' : '—',
      finCashAfter: money(m.finance.cashAfter, 0) + t('common.perMonth'),
      selfFundText: t('s2.selfFund', {
        cov: nf(m.finance.coverage, 2),
        cash: money(m.finance.cashAfter, 0),
        vsOld: signedMoney(m.finance.vsOldCash, 0),
        term: m.finance.months
      }),
      hahaTotalCost: money(m.haha.cost, 0) + t('common.perMonth'),
      kpiGain: m.hasData ? signedMoney(m.invest.delta, 0) : '—',
      kpiAnnual: m.hasData ? signedMoney(m.invest.annualDelta, 0) + t('common.perYear') : '—',
      kpiStandalone: m.hasData ? monthsFmt(m.invest.standalonePayback) : '—',
      kpiInc: m.hasData ? monthsFmt(m.invest.payback) : '—',
      kpi3yr: m.hasData ? signedMoney(m.invest.threeYearNet, 0) : '—',
      zeroProfit: money(m.haha.zeroGrowthProfit, 0),
      zeroText: t('s2.zeroText', {
        v: money(m.haha.zeroGrowthProfit, 0),
        gap: signedMoney(m.haha.zeroGrowthProfit - m.old.profit, 0)
      }),
      propMo: money(m.siteEarnings.monthly, 0),
      propYr: money(m.siteEarnings.annual, 0)
    };

    $$('[data-out]').forEach(el => {
      const k = el.dataset.out;
      if (out[k] !== undefined) el.textContent = out[k];
    });

    /* Mutually exclusive visibility flags */
    const flags = {
      pmActual: p.baseline.profitMode === 'actual',
      pmMargin: p.baseline.profitMode === 'margin',
      pmDetail: p.baseline.profitMode === 'detail',
      dealHasTerms: p.site.deal !== 'none',
      dealHasShare: p.site.deal === 'share' || p.site.deal === 'combo',
      dealHasRent: p.site.deal === 'rent' || p.site.deal === 'combo',
      overrideDeal: !!p.site.overrideDeal,
      orderCapped: m.growth.orderCapped,
      aovCapped: m.growth.aovCapped,
      finEnabled: !!p.invest.finance.enabled,
      finDisabled: !p.invest.finance.enabled,
      selfFunding: m.finance.selfFunding,
      hiddenRepairRisk: m.hiddenRepairRisk,
      ordersEstimated: !!p.baseline.ordersEstimated
    };
    $$('[data-show]').forEach(el => {
      const k = el.dataset.show;
      if (flags[k] !== undefined) el.classList.toggle('hidden', !flags[k]);
    });

    const covEl = $('[data-tone="finCovTone"]');
    if (covEl) {
      covEl.classList.toggle('pos', m.finance.coverage >= 1.25);
      covEl.classList.toggle('neg', m.finance.coverage < 1.25);
    }

    const zc = $('#zeroCallout');
    if (zc) {
      zc.classList.toggle('good', m.haha.zeroGrowthProfit >= m.old.profit);
      zc.classList.toggle('warn', m.haha.zeroGrowthProfit < m.old.profit);
    }

    /* Update model active & recommended badges */
    $$('[data-model-card]').forEach(btn => {
      const id = btn.dataset.modelCard;
      btn.classList.toggle('on', id === m.invest.effectiveModelId);
      const rec = btn.querySelector(`[data-rec-badge="${id}"]`);
      if (rec) rec.classList.toggle('hidden', id !== m.invest.recModelId);
    });

    /* Comparison table */
    const cmpHost = $('[data-out-html="cmpTable"]');
    if (cmpHost) {
      cmpHost.innerHTML = `
        <table class="table">
          <thead><tr><th>${esc(t('s2.metric'))}</th><th class="r">${esc(t('s2.cur'))}</th><th class="r">${esc(t('s2.haha'))}</th><th class="r">${esc(t('s2.chg'))}</th></tr></thead>
          <tbody>
            <tr><td>${esc(t('s2.rOrders'))}</td><td class="r">${nf(m.old.monthlyOrders, 0)}</td><td class="r">${nf(m.haha.monthlyOrders, 0)}</td><td class="r">+${pct(m.growth.orderPct, 1)}</td></tr>
            <tr><td>${esc(t('s2.rAov'))}</td><td class="r">${money(m.old.aov, 2)}</td><td class="r">${money(m.haha.aov, 2)}</td><td class="r">${signedMoney(m.haha.aov - m.old.aov, 2)}</td></tr>
            <tr><td>${esc(t('s2.rSales'))}</td><td class="r">${money(m.old.sales, 0)}</td><td class="r">${money(m.haha.sales, 0)}</td><td class="r pos">${signedMoney(m.growth.totalRevenueGrowth, 0)}</td></tr>
            <tr class="total"><td>${esc(t('s2.rCost'))}</td><td class="r">${money(m.old.cost, 0)}</td><td class="r">${money(m.haha.cost, 0)}</td><td class="r">${signedMoney(m.haha.cost - m.old.cost, 0)}</td></tr>
            <tr class="primary"><td>${esc(t('s2.rProfit'))}</td><td class="r">${money(m.old.profit, 0)}</td><td class="r">${money(m.haha.profit, 0)}</td><td class="r ${m.invest.delta >= 0 ? 'pos' : 'neg'}">${signedMoney(m.invest.delta, 0)}</td></tr>
            <tr><td>${esc(t('s2.rMargin'))}</td><td class="r">${pct(m.old.margin, 1)}</td><td class="r">${pct(m.haha.margin, 1)}</td><td class="r">${(m.haha.margin - m.old.margin >= 0 ? '+' : '') + nf(m.haha.margin - m.old.margin, 1)} ${esc(t('s2.pts'))}</td></tr>
          </tbody>
        </table>
      `;
    }

    /* Stress test table */
    const stHost = $('[data-out-html="stressTable"]');
    if (stHost) {
      stHost.innerHTML = `
        <table class="table">
          <thead><tr><th>%</th><th class="r">${esc(t('rep.profit'))}</th><th class="r">${esc(t('rep.delta'))}</th><th class="r">${esc(t('rep.payback'))}</th>${m.finance.enabled ? `<th class="r">${esc(t('s2.cov'))}</th>` : ''}</tr></thead>
          <tbody>
            ${m.stress.map(st => `
              <tr>
                <td>${nf(st.scale * 100, 0)}%</td>
                <td class="r">${money(st.profit, 0)}</td>
                <td class="r ${st.delta >= 0 ? 'pos' : 'neg'}">${signedMoney(st.delta, 0)}</td>
                <td class="r">${esc(monthsFmt(st.payback))}</td>
                ${m.finance.enabled ? `<td class="r">${isFinite(st.coverage) ? nf(st.coverage, 2) + '×' : '—'}</td>` : ''}
              </tr>
            `).join('')}
          </tbody>
        </table>
      `;
    }

    /* 36-Month SVG Chart */
    const chartHost = $('#cumChartHost');
    if (chartHost) chartHost.innerHTML = cumulativeSvg(m, 680, 215);

    /* Decision Verdict Box */
    const vHost = $('[data-out-html="verdictBox"]');
    if (vHost) {
      const bullets = buildDecisionBullets(m);
      const nexts = buildConsultativeNextSteps(m);
      vHost.innerHTML = `
        <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap">
          <span class="status-badge ${m.verdict}">${esc(t('verdict.' + m.verdict))}</span>
          <strong style="font-size:13.5px;color:#ddd">${esc(m.invest.model.name)} · ${money(m.invest.total, 0)}</strong>
        </div>
        <ul>${bullets.map(r => `<li>${esc(r)}</li>`).join('')}</ul>
        <ol style="margin-top:10px;border-top:1px solid rgba(255,255,255,.14);padding-top:10px">${nexts.map(n => `<li>${esc(n)}</li>`).join('')}</ol>
      `;
    }

    /* Warnings */
    const wHost = $('[data-out-html="warningsHost"]');
    if (wHost) {
      wHost.innerHTML = m.warnings.map(w => `
        <div class="warn-item ${w.level === 'info' ? 'info' : ''}">
          <strong>${w.level === 'info' ? 'i' : '!'}</strong>
          <span>${esc(t('warn.' + w.code, w.vars))}</span>
        </div>
      `).join('');
    }

    /* Right Sticky Snapshot Rail */
    const rail = $('#railHost');
    if (rail) {
      rail.innerHTML = `
        <div class="rail-panel">
          <div class="rail-label">${esc(t('r2.title'))}</div>
          <div style="margin-bottom:10px"><span class="status-badge ${m.verdict}">${esc(t('verdict.' + m.verdict))}</span></div>
          <div class="rail-label" style="margin-top:12px;margin-bottom:2px">${esc(t('r2.gain'))}</div>
          <div class="rail-big ${m.invest.delta >= 0 ? 'pos' : 'neg'}">${m.hasData ? signedMoney(m.invest.delta, 0) : '—'}</div>
          <div class="rail-sub">${m.hasData ? signedMoney(m.invest.annualDelta, 0) + t('common.perYear') : ''}</div>
          <div class="rail-div"></div>
          <div class="rail-row"><span>${esc(t('r2.inc'))}</span><strong>${m.hasData ? esc(monthsFmt(m.invest.payback)) : '—'}</strong></div>
          <div class="rail-row"><span>${esc(t('r2.threeYr'))}</span><strong>${m.hasData ? signedMoney(m.invest.threeYearNet, 0) : '—'}</strong></div>
          <div class="rail-row"><span>${esc(t('r2.netInv'))}</span><strong>${money(m.invest.total, 0)}</strong></div>
          <div class="rail-row"><span>${esc(t('r2.model'))}</span><strong>${esc(m.invest.model.name)}</strong></div>
        </div>
      `;
    }
    syncStepGates(p);
    renderStorageWarning();
  }
}

function syncStepGates(p) {
  if (!p) return;
  const s1 = validateStep1(p);
  const s2 = validateStep2(p);
  const ready = { step2: s1.ok, step3: s1.ok && s2.ok };

  $$('[data-step-cta]').forEach(btn => {
    const step = btn.dataset.stepCta;
    const ok = !!ready[step];
    btn.disabled = !ok;
    btn.setAttribute('aria-disabled', String(!ok));
    btn.title = ok ? '' : (step === 'step3' ? stepMissingText('step2', p) : stepMissingText('step1', p));
  });
  $$('[data-step-hint]').forEach(el => {
    const step = el.dataset.stepHint;
    el.textContent = stepMissingText(step, p);
  });

  $$('.nav-item[data-nav="step2"]').forEach(btn => {
    btn.disabled = !s1.ok;
    btn.title = s1.ok ? '' : t('validate.step1First');
  });
  $$('.nav-item[data-nav="step3"]').forEach(btn => {
    const ok = s1.ok && s2.ok;
    btn.disabled = !ok;
    btn.title = ok ? '' : (s1.ok ? t('validate.step2First') : t('validate.step1First'));
  });
}

</script>
<script data-src="js/events.js">
/* =====================================================================
   HAHA Location Replacement Assessment v2.3
   ===================================================================== */
'use strict';

function goToStep(step) {
  const p = getActiveProject();
  if (!p) return;
  if (!canEnterStep(step, p)) {
    toast(stepMissingText(step === 'step3' ? 'step2' : 'step1', p));
    return;
  }
  app.view = step;
  mountView();
}

document.addEventListener('click', e => {
  /* Navigation links */
  const nav = e.target.closest('[data-nav]');
  if (nav && !nav.disabled) {
    e.preventDefault();
    const target = nav.dataset.nav;
    const p = getActiveProject();
    if (target === 'step2' && !canEnterStep('step2', p)) {
      toast(stepMissingText('step1', p));
      return;
    }
    if (target === 'step3' && !canEnterStep('step3', p)) {
      toast(stepMissingText('step2', p));
      return;
    }
    app.view = target;
    const sb = $('#sidebar'); if (sb) sb.classList.remove('open');
    const ov = $('#sidebarOverlay'); if (ov) ov.classList.remove('show');
    mountView();
    try { window.scrollTo({ top: 0, behavior: 'smooth' }); } catch (err) {}
    return;
  }

  if (e.target.id === 'sidebarOverlay') {
    $('#sidebar').classList.remove('open');
    $('#sidebarOverlay').classList.remove('show');
    return;
  }
  if (e.target.id === 'modalBack') { closeModal(); return; }

  /* Delete button inside project card stops card click propagation */
  const delBtn = e.target.closest('[data-action="askDelete"]');
  if (delBtn) {
    e.stopPropagation();
    askDeleteModal(delBtn.dataset.id);
    return;
  }

  /* Single-value setters (Chips / Segmented Controls / Diagnostic 10-5-0) */
  const setBtn = e.target.closest('[data-set]');
  if (setBtn) {
    const p = getActiveProject();
    if (!p) return;
    const path = setBtn.dataset.set;
    let val = setBtn.dataset.value;
    if (val === 'true') val = true;
    else if (val === 'false') val = false;
    else if (/^\d+(\.\d+)?$/.test(val)) val = Number(val);

    setPath(p, path, val);
    if (path === 'invest.modelId') p.invest.modelManual = true;

    const chipGrp = setBtn.closest('[data-chip-group]');
    if (chipGrp) $$('button', chipGrp).forEach(b => b.classList.toggle('on', b === setBtn));

    const segGrp = setBtn.closest('[data-seg-group]');
    if (segGrp) $$('button', segGrp).forEach(b => b.classList.toggle('on', b === setBtn));

    const diagGrp = setBtn.closest('[data-diag-group]');
    if (diagGrp) {
      $$('button', diagGrp).forEach(b => {
        b.classList.remove('on-10', 'on-5', 'on-0');
        if (b === setBtn) b.classList.add('on-' + val);
      });
    }

    /* Update uplift % input directly when acceptance changes */
    if (/^uplift\.[a-z]+\.accept$/.test(path)) {
      const k = path.split('.')[1];
      const q = compute(p).quadrantId;
      const f = val === 'yes' ? 1 : val === 'partial' ? 0.5 : 0;
      const newPct = round1(QUADRANT_BASE[q][k] * f);
      p.uplift[k].pct = newPct;
      p.uplift[k].custom = false;
      const pctInp = $(`[data-bind="uplift.${k}.pct"]`);
      if (pctInp) pctInp.value = newPct;
    }

    p.updatedAt = new Date().toISOString();
    saveState();
    syncOutputs();
    return;
  }

  /* Multi-select toggles (Payments Accepted) */
  const togBtn = e.target.closest('[data-toggle]');
  if (togBtn) {
    const p = getActiveProject();
    if (!p) return;
    const arr = getPath(p, togBtn.dataset.toggle);
    if (Array.isArray(arr)) {
      const v = togBtn.dataset.value;
      const i = arr.indexOf(v);
      if (i >= 0) arr.splice(i, 1); else arr.push(v);
      togBtn.classList.toggle('on', arr.includes(v));
      p.updatedAt = new Date().toISOString();
      saveState();
      syncOutputs();
    }
    return;
  }

  /* General Actions */
  const act = e.target.closest('[data-action]');
  if (!act || act.disabled) return;
  const a = act.dataset.action;

  if (a === 'toggleMenu') {
    $('#sidebar').classList.toggle('open');
    $('#sidebarOverlay').classList.toggle('show');
  } else if (a === 'lang') {
    app.lang = act.dataset.value;
    saveState();
    mountView();
  } else if (a === 'openNewModal') {
    openNewProjectModal();
  } else if (a === 'closeModal') {
    closeModal();
  } else if (a === 'loadSample') {
    const p = createSampleProject();
    app.projects.unshift(p);
    app.activeId = p.id;
    app.view = 'step1';
    saveState();
    mountView();
    toast(t('common.sampleCreated'));
  } else if (a === 'openProj') {
    app.activeId = act.dataset.id;
    app.view = 'step1';
    saveState();
    mountView();
    try { window.scrollTo({ top: 0, behavior: 'smooth' }); } catch (err) {}
  } else if (a === 'confirmDelete') {
    const id = act.dataset.id;
    app.projects = app.projects.filter(x => x.id !== id);
    if (app.activeId === id) app.activeId = app.projects[0] ? app.projects[0].id : null;
    saveState();
    closeModal();
    mountView();
    toast(t('common.deleted'));
  } else if (a === 'goStep1') { goToStep('step1'); }
  else if (a === 'goStep2') { goToStep('step2'); }
  else if (a === 'goStep3') { goToStep('step3'); }
  else if (a === 'estOrders') {
    const p = getActiveProject();
    if (p) {
      const sales = num(p.baseline.monthlySales);
      if (sales > 0) {
        const est = Math.round(sales / 2.5);
        p.baseline.monthlyOrders = est;
        p.baseline.ordersEstimated = true;
        const inp = $('[data-bind="baseline.monthlyOrders"]');
        if (inp) inp.value = est;
        saveState();
        syncOutputs();
      }
    }
  } else if (a === 'autoModel') {
    const p = getActiveProject();
    if (p) {
      p.invest.modelManual = false;
      saveState();
      syncOutputs();
    }
  } else if (a === 'resetUplift') {
    const p = getActiveProject();
    if (p) {
      syncUpliftBase(p, true);
      ['variety', 'basket', 'stock', 'payment'].forEach(k => {
        const inp = $(`[data-bind="uplift.${k}.pct"]`);
        if (inp) inp.value = p.uplift[k].pct;
      });
      saveState();
      syncOutputs();
    }
  } else if (a === 'toggleCost') {
    app.costExpanded = !app.costExpanded;
    const body = $('#costBody');
    const arrow = $('#costArrow');
    if (body) body.classList.toggle('hidden', !app.costExpanded);
    if (arrow) arrow.textContent = app.costExpanded ? '▲' : '▼';
  } else if (a === 'backupProject') {
    const p = app.projects.find(x => x.id === act.dataset.id) || getActiveProject();
    if (p && backupProjectFile(p)) toast(t('common.backedUp'));
    else toast(t('common.backupFailed'));
  } else if (a === 'exportAll') {
    if (exportAllFile()) toast(t('common.exportedAll'));
    else toast(t('common.backupFailed'));
  } else if (a === 'importProjects') {
    const imp = $('#importFile');
    if (imp) imp.click();
  } else if (a === 'printReport') {
    try { window.print(); } catch (err) {}
  } else if (a === 'downloadReport') {
    const p = getActiveProject();
    if (!p) return;
    const m = compute(p);
    const css = collectAppCss();
    const html = `<!DOCTYPE html><html lang="${app.lang === 'zh' ? 'zh-CN' : 'en'}"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${esc(p.meta.locationName || 'HAHA Assessment Report')}</title><style>${css} body{background:#fff;padding:24px}</style></head><body>${reportDocumentHtml(p, m)}</body></html>`;
    const fname = 'HAHA-' + safeFilePart(p.meta.locationName) + '-Report.html';
    if (downloadFile(fname, html, 'text/html;charset=utf-8')) {
      toast(t('common.reportDownloaded'));
    } else {
      toast(t('common.backupFailed'));
    }
  }
});

/* STRICT ZERO-RE-RENDER INPUT HANDLER */
document.addEventListener('input', e => {
  /* Search bar updates ONLY #projCardsHost so search input never loses focus */
  if (e.target.id === 'projSearch') {
    app.search = e.target.value;
    const host = $('#projCardsHost');
    if (host) host.innerHTML = projectCardsHtml();
    return;
  }

  const el = e.target.closest('[data-bind]');
  if (!el) return;
  const p = getActiveProject();
  if (!p) return;

  const path = el.dataset.bind;
  const val = el.type === 'checkbox' ? el.checked : el.value;
  setPath(p, path, val);
  if (path === 'baseline.monthlyOrders') p.baseline.ordersEstimated = false;
  if (/^uplift\.[a-z]+\.pct$/.test(path)) {
    p.uplift[path.split('.')[1]].custom = true;
  }
  p.updatedAt = new Date().toISOString();
  saveState();
  syncOutputs();
});

document.addEventListener('change', e => {
  const el = e.target.closest('[data-bind]');
  if (!el) return;
  if (el.type === 'checkbox' || el.tagName === 'SELECT') {
    const p = getActiveProject();
    if (!p) return;
    setPath(p, el.dataset.bind, el.type === 'checkbox' ? el.checked : el.value);
    p.updatedAt = new Date().toISOString();
    saveState();
    syncOutputs();
  }
});

/* Escape key closes modal */
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeModal();
});

/* Import Project JSON (single project, all-project export, or legacy array) */
const impInput = $('#importFile');
if (impInput) {
  impInput.addEventListener('change', e => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const result = parseImportPayload(reader.result);
        const added = importProjects(result.items);
        if (added > 0) {
          saveState();
          mountView();
          toast(result.skipped
            ? t('common.importedSkipped', { count: added, skipped: result.skipped })
            : t('common.imported', { count: added }));
        } else {
          toast(t('common.invalidFile'));
        }
      } catch (err) {
        toast(t('common.importFailed'));
      }
    };
    reader.readAsText(file);
    e.target.value = '';
  });
}

</script>
<script data-src="js/boot.js">
/* =====================================================================
   HAHA Location Replacement Assessment v2.3
   ===================================================================== */
'use strict';

function mountView() {
  document.documentElement.lang = app.lang === 'zh' ? 'zh-CN' : 'en';
  const p = getActiveProject();
  if (['step1', 'step2', 'step3'].includes(app.view) && !p) {
    app.view = 'dashboard';
  }
  renderSidebar();
  renderTopbar();

  const host = $('#pageContent');
  if (!host) return;

  if (app.view === 'dashboard') {
    host.innerHTML = renderDashboard();
  } else if (app.view === 'projects') {
    host.innerHTML = renderProjects();
  } else if (app.view === 'step1') {
    host.innerHTML = renderStep1(p);
    syncOutputs();
  } else if (app.view === 'step2') {
    syncUpliftBase(p, false);
    host.innerHTML = renderStep2(p);
    syncOutputs();
  } else if (app.view === 'step3') {
    syncUpliftBase(p, false);
    host.innerHTML = renderStep3(p, compute(p));
  }
}

/* Boot immediately */
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', mountView);
} else {
  mountView();
}

</script>
</body>
